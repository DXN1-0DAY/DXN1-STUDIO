<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DXN1 STUDIO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <div class="sidebar-header">
        <span class="logo">DXN1</span>
        <span class="studio">STUDIO</span>
      </div>
      <div class="file-tree">
        <div class="file-item folder">📁 src</div>
        <div class="file-item">📄 index.js</div>
        <div class="file-item">📄 style.css</div>
        <div class="file-item folder">📁 components</div>
      </div>
    </div>
    <div id="main">
      <div id="tabs">
        <div class="tab active">index.js</div>
        <div class="tab">style.css</div>
        <div class="tab">+</div>
      </div>
      <div id="editor">
        <textarea id="code-editor" spellcheck="false">// Welcome to DXN1 STUDIO
function hello() {
  console.log("Hello World");
}</textarea>
      </div>
    </div>
    <div id="bottom-panel">
      <div id="terminal">
        <div class="terminal-header">TERMINAL</div>
        <div class="terminal-content">
          <div class="terminal-line">$ dxn1-studio v1.0.0</div>
          <div class="terminal-line">$ Ready</div>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
