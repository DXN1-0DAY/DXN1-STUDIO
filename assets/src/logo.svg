<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- DXN1 STUDIO 3 emblem — portal ring + angular 3 -->
  <!-- Vector source; raster exports live in assets/ (logo/banner/social). -->
  <defs>
    <linearGradient id="purp" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#B04FF7"/>
      <stop offset="0.55" stop-color="#9333EA"/>
      <stop offset="1" stop-color="#7A16D2"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#131018"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <clipPath id="icon"><rect x="112" y="112" width="800" height="800" rx="170"/></clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect x="132" y="132" width="760" height="760" rx="160" fill="#9333EA" opacity="0.28" filter="url(#glow)"/>
  <rect x="112" y="112" width="800" height="800" rx="170" fill="url(#purp)"/>
  <rect x="200" y="200" width="624" height="624" rx="124" fill="none" stroke="#050505" stroke-width="46"/>

  <!-- the 3: angular left, rounded right bowls, wedge speed-cut -->
  <path fill="#050505" d="
    M 392,320
    L 598,320  Q 668,320 668,390
    L 668,634  Q 668,704 598,704
    L 392,704  L 356,668  L 356,616
    L 580,616  L 580,556
    L 470,556  L 420,512  L 470,468
    L 580,468  L 580,408
    L 356,408  L 356,356  Z"/>

  <g clip-path="url(#icon)">
    <g stroke="#050505" stroke-width="46" stroke-linecap="butt">
      <path d="M 560,60  L 960,460"/>
      <path d="M 464,964 L 64,564"/>
    </g>
    <g stroke="#A855F7" stroke-width="6" opacity="0.6">
      <path d="M 560,60  L 960,460"/>
      <path d="M 464,964 L 64,564"/>
    </g>
  </g>
</svg>
