# the release train: every tag pushed to origin mints its GitHub
# Release with notes lifted from CHANGELOG.md (the honest words travel
# with the version). The sweep job runs on master pushes and backfills
# any tag that never got its release — the train never leaves a
# station behind. No secrets beyond the runner's own GITHUB_TOKEN.

name: release

on:
  push:
    tags: ['v*']
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  mint:
    name: mint the tag's release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: build the zero-dependency binaries
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          echo "building for TAG=${TAG} (ref=${GITHUB_REF:-?})"
          # the engine speaks C++23's <print> — the runner's default
          # g++ is 13 and that header needs 14; install it first.
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-14
          CXX=g++-14 make -s -C native
          test -x native/build/dxn3-native
          test -x native/build/dxn3-selftest
          tar czf "dxn3-${TAG}.tar.gz" -C native/build dxn3-native dxn3-selftest \
            -C "$GITHUB_WORKSPACE" scenes ui README.md CHANGELOG.md
          test -s "dxn3-${TAG}.tar.gz"
          ls -la "dxn3-${TAG}.tar.gz"
      - name: extract the notes and mint
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/release_notes.py "$TAG" > notes.md
          gh release create "$TAG" --title "DXN1 STUDIO $TAG" \
            --notes-file notes.md || gh release edit "$TAG" --notes-file notes.md
          test -s "dxn3-${TAG}.tar.gz"
          gh release upload "$TAG" "dxn3-${TAG}.tar.gz" --clobber
          gh release view "$TAG" --json assets -q '.assets[].name'

  sweep:
    name: backfill every tag without a release
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: the sweep (the reconcile law owns it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release_reconcile.sh
